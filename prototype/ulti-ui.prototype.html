<title>ULTI Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<!--
  PROTOTYPE: throwaway, do not ship.
  Question: what should ULTI's logging screen, Home and Group board look and feel like on a phone, one-handed?
  The logging screen has 3 structurally different variants: A "Lista" (the design decided in docs/design.md),
  B "Foco" (one Set at a time), C "Pulgar" (list on top, fixed controls at the bottom).
  Switch them from the prototype bar, with the left/right arrow keys, or with #lista / #foco / #pulgar.
  The prototype bar sits at the top instead of bottom-centre because the bottom of the screen is the app's thumb zone.
  All data is fake and lives in memory.
-->
<style>
:root{
  /* Layout: one phone-width column; each screen scrolls inside it; the tab bar sits at the bottom of the column. Arcade, dark first. */
  --bg:#0E0B1F; --surface:#17132F; --surface-2:#211C42; --line:#2F2A58; --fg:#F4F1FF; --muted:#A49FC7;
  --accent:#FF4D9D; --accent-ink:#1A0614; --accent-text:#FF4D9D; --danger:#FF5D4F; --scrim:rgba(6,4,18,.66);
  --bronze:#D9894F; --silver:#C3CAD6; --gold:#FFC83D; --diamond:#7BE7FF; --elite:#A98BFF;
  --display:"Unbounded","Arial Black",sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --numfont:"Manrope",system-ui,sans-serif;
  --ds:.66; --dcase:uppercase; --logo-bg:#0E0B1F;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F7F4FF; --surface:#FFFFFF; --surface-2:#ECE8FA; --line:#D9D3F0; --fg:#1A1433; --muted:#5C5680;
    --accent:#FF4D9D; --accent-ink:#1A0614; --accent-text:#C2185F; --danger:#D63A2E; --scrim:rgba(26,20,51,.45);
    --bronze:#A8602A; --silver:#7A8497; --gold:#A87900; --diamond:#0F8FAE; --elite:#6A3FE0;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
    --bg:#F7F4FF; --surface:#FFFFFF; --surface-2:#ECE8FA; --line:#D9D3F0; --fg:#1A1433; --muted:#5C5680;
    --accent:#FF4D9D; --accent-ink:#1A0614; --accent-text:#C2185F; --danger:#D63A2E; --scrim:rgba(26,20,51,.45);
    --bronze:#A8602A; --silver:#7A8497; --gold:#A87900; --diamond:#0F8FAE; --elite:#6A3FE0;
    color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:10px}
h1,h2,h3,p{margin:0}
#app{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;padding-top:52px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.scroller{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:8px 24px;display:flex;flex-direction:column;gap:20px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.num{font-family:var(--numfont,var(--display));font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.muted{color:var(--muted)}
.disp{font-family:var(--display);font-weight:800;text-transform:var(--dcase,uppercase);letter-spacing:.01em;line-height:1;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.info{width:28px;height:28px;margin:-6px -4px;display:inline-grid;place-items:center;flex:none}
.info span{width:17px;height:17px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font:700 10px/1 var(--body);color:var(--muted)}
.btn-primary{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:18px;min-height:64px;font-family:var(--display);font-weight:800;font-size:calc(26px*var(--ds,1));text-transform:var(--dcase,uppercase);display:flex;align-items:center;justify-content:center;gap:10px}
.btn-ghost{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}

/* home */
.home-head{display:flex;align-items:baseline;gap:10px;padding-top:4px}
.wordmark{font-family:var(--display);font-weight:800;font-size:calc(44px*var(--ds,1));line-height:.9;letter-spacing:.02em}
.tagline{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted);text-transform:var(--dcase,uppercase)}
.since{flex-direction:row;align-items:flex-start;gap:12px;background:var(--surface-2)}
.since ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.since b{font-weight:600}
.since .x{margin-left:auto;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);flex:none}
.week-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.week-pts{display:flex;align-items:baseline;gap:6px}
.week-pts .num{font-size:calc(60px*var(--ds,1));line-height:.85}
.week-pts span:last-child{font-weight:600;color:var(--muted)}
.dots{display:flex;gap:7px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.btn-start{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px}
.btn-start .disp{font-size:calc(32px*var(--ds,1))}
.btn-start small{font-weight:600;font-size:14px;opacity:.75}
.races{display:flex;flex-direction:column;gap:8px}
.race{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%}
.race .gname{font-weight:600}
.race .gsub{font-size:13px;color:var(--muted)}
.race .place{grid-row:1 / span 2;grid-column:2;display:flex;align-items:baseline;gap:2px}
.race .place .num{font-size:calc(40px*var(--ds,1));line-height:.9}
.race .place small{font-weight:600;color:var(--muted)}

/* rank */
.rb{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap}
.crown{width:16px;height:16px;color:var(--gold);flex:none}

/* tabs */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding-block:4px 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--accent-text)}
.live{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;width:100%}
.live .t{flex:1;min-width:0;font-size:14px}
.live b{font-weight:600}
.live .go{font-weight:700;color:var(--accent-text)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite;flex:none}

/* session */
.s-head{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.iconbtn svg{width:24px;height:24px}
.s-title{font-family:var(--display);font-weight:800;font-size:calc(22px*var(--ds,1));text-transform:var(--dcase,uppercase);line-height:1}
.s-sub{font-size:13px;color:var(--muted)}
.legend{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ex{display:flex;flex-direction:column;gap:8px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font-family:var(--display);font-weight:700;font-size:calc(25px*var(--ds,1));text-transform:var(--dcase,uppercase);line-height:1}
.ex-meta{font-size:13px;color:var(--muted);margin-top:3px}
.rec{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:5px 9px;white-space:nowrap}
.rec.up{background:var(--accent);color:var(--accent-ink)}
.rec.stall{border:1px solid var(--line);color:var(--muted)}
.set{display:grid;grid-template-columns:44px minmax(0,1fr) 14px 64px 56px;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;min-height:62px}
.set.warm{background:transparent;border-style:dashed}
.set.done{background:var(--surface-2);border-color:transparent}
.tag{height:46px;border-radius:10px;font-family:var(--display);font-weight:700;font-size:calc(20px*var(--ds,1));color:var(--muted);text-align:center}
.set.warm .tag{font-size:15px;letter-spacing:.04em}
.cell{height:48px;border-radius:10px;font-size:calc(28px*var(--ds,1));display:flex;align-items:baseline;justify-content:center;gap:3px;background:var(--surface-2);padding-top:6px;white-space:nowrap}
.set.done .cell{background:transparent}
.cell small{font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted)}
.xmark{color:var(--muted);text-align:center;font-size:14px}
.check{width:56px;height:48px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.check svg{width:24px;height:24px}
.set.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rirbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-size:13px;font-weight:500;animation:fade .2s}
.rirbar .q{display:flex;align-items:center;gap:4px;margin-right:auto}
.rirbar .chips{display:flex;gap:6px}
.rirbar .chips button{min-width:40px;height:38px;border-radius:999px;border:1px solid var(--line);font-family:var(--display);font-weight:700;font-size:calc(19px*var(--ds,1));text-align:center;background:var(--surface)}
.finish-end{margin-top:8px}

/* variant B */
.focus{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:14px 14px}
.f-prog{display:flex;gap:4px}
.f-prog span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.f-prog span.done{background:var(--muted)}
.f-prog span.on{background:var(--accent-text)}
.f-name{font-family:var(--display);font-weight:800;font-size:calc(38px*var(--ds,1));text-transform:var(--dcase,uppercase);line-height:.95}
.f-label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.f-nums{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:auto}
.f-num{display:flex;flex-direction:column;align-items:center;padding:16px 0 12px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-align:center}
.f-num .num{font-size:calc(76px*var(--ds,1));line-height:.85}
.f-num .unit{font-size:13px;color:var(--muted);font-weight:600}
.f-x{color:var(--muted);font-size:calc(20px*var(--ds,1))}
.f-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.chip svg{width:13px;height:13px}
.chip.done{background:var(--surface-2);border-color:transparent;color:var(--fg)}
.chip.cur{border-color:var(--accent-text);color:var(--fg)}
.f-nav{display:flex;justify-content:space-between}
.f-nav button{padding:10px 4px;color:var(--muted);font-weight:600}

/* variant C */
.c-ex{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.c-ex h3{font-family:var(--display);font-weight:700;font-size:calc(19px*var(--ds,1));text-transform:var(--dcase,uppercase)}
.c-rows{display:flex;flex-direction:column;gap:4px}
.c-row{display:grid;grid-template-columns:32px 1fr 28px;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:12px;border:1.5px solid transparent;background:var(--surface)}
.c-row .num{font-size:calc(22px*var(--ds,1))}
.c-row .idx{font-family:var(--display);font-weight:700;color:var(--muted);font-size:15px}
.c-row.cur{border-color:var(--accent-text)}
.c-row.done{background:transparent}
.c-row.done .num{color:var(--muted)}
.c-row .ok{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.c-row.done .ok{background:var(--accent);color:var(--accent-ink)}
.c-row .ok svg{width:15px;height:15px}
.deck{border-top:1px solid var(--line);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.deck-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.deck-label .disp{font-size:calc(20px*var(--ds,1))}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;height:66px}
.stepper > button:first-child,.stepper > button:last-child{height:100%;font-size:calc(28px*var(--ds,1));font-weight:500;text-align:center;color:var(--muted)}
.stepper .val{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}
.stepper .val .num{font-size:calc(32px*var(--ds,1));line-height:1}
.stepper .val small{font-size:11px;color:var(--muted);font-weight:600}

/* groups */
.gchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.gchip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;white-space:nowrap}
.gchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.g-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.g-head .disp{font-size:calc(34px*var(--ds,1))}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-top:6px}
.mode b{color:var(--fg);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:9px 0;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.board{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:22px 40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px 10px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:100%}
.row.me{border-color:var(--accent-text)}
.pos{font-size:calc(22px*var(--ds,1));color:var(--muted);text-align:center}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#14170f;font-weight:700;font-size:14px;flex:none}
.who{min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{font-weight:600;display:flex;align-items:center;gap:6px}
.sub{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mini-dots{display:flex;gap:3px}
.mini-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.mini-dots i.on{background:var(--accent-text)}
.prchip{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2)}
.score{font-size:calc(30px*var(--ds,1));text-align:right}
.foot{font-size:12px;color:var(--muted);text-align:center}

/* train + profile */
.r-day{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.r-day .disp{font-size:calc(20px*var(--ds,1))}
.hist{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.me-head{display:flex;align-items:center;gap:12px}
.me-head .av{width:56px;height:56px;font-size:18px}
.rank-card{--t:var(--silver)}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--t)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%}
.switch{width:50px;height:30px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.toggle-row[aria-checked="true"] .switch{background:var(--accent);border-color:var(--accent)}
.toggle-row[aria-checked="true"] .switch::after{left:23px;background:var(--accent-ink)}
.marks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mark{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.mark svg{width:100%;max-width:96px;height:auto;border-radius:22%}

/* sheets & overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .15s}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:440px;z-index:41;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding-top:16px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out;max-height:88%;overflow-y:auto}
.kp-head{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);gap:8px}
.kp-display{font-size:calc(66px*var(--ds,1));text-align:center;line-height:1;padding-top:4px}
.kp-display small{font-size:18px;color:var(--muted);margin-left:6px;font-family:var(--body);font-weight:600}
.kp-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kp-steps button,.kp-grid button{border-radius:14px;background:var(--surface-2);font-family:var(--display);font-weight:700;text-align:center}
.kp-steps button{height:50px;font-size:calc(24px*var(--ds,1))}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp-grid button{height:54px;font-size:calc(28px*var(--ds,1))}
.kp-grid button:disabled{opacity:.25}
.kp-grid svg{width:26px;height:26px;vertical-align:middle}
.m-head{display:flex;align-items:center;gap:12px}
.m-head .av{width:52px;height:52px;font-size:17px}
.m-head .disp{font-size:calc(28px*var(--ds,1))}
.m-list{display:flex;flex-direction:column}
.m-list div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.invite-link{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;background:var(--surface-2);border-radius:12px;padding:14px;user-select:all;text-align:center}
#banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translate(-50%,-160%);opacity:0;width:min(408px, calc(100% - 32px));z-index:60;pointer-events:none;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 16px;font-family:var(--display);font-weight:800;font-size:calc(22px*var(--ds,1));text-transform:var(--dcase,uppercase);line-height:1.05;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:transform .4s cubic-bezier(.2,1.3,.4,1),opacity .2s}
#banner.show{transform:translate(-50%,0);opacity:1}
#banner small{display:block;font-family:var(--body);font-weight:600;font-size:13px;text-transform:none;opacity:.8;margin-top:3px}
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;justify-content:center;animation:fade .2s}

/* ---------- Tier badges: one crest family in polished metal. A keystone holds a glowing gem between swept blade wings.
   Each Tier changes the metal and adds a layer (Silver a lower blade, Gold a tail and a crown, Diamond an upper wing, Elite a
   great back wing and rays). Each Division adds one thing you can name: IV studs set into the wings, III a fin rising off each wing,
   II a crown spike (side spikes from Gold up), I a glow and a flaring gem; and the wings spread wider every step.
   Every piece is lit from above: a face, a bevel inside its edge and a bright rim, with a soft shadow on the piece behind.
   Small badges (leaderboard rows) are the crest's flat silhouette. ---------- */
const ROMAN = {V:5,IV:4,III:3,II:2,I:1};
const TIERS = ['bronze','silver','gold','diamond','elite'];
const pt = (r,deg) => [100+r*Math.cos(deg*Math.PI/180), 100+r*Math.sin(deg*Math.PI/180)];
const P2 = p => p[0].toFixed(1)+' '+p[1].toFixed(1);
const poly = pts => 'M'+pts.map(P2).join('L')+'Z';
const FLIP = 'translate(200 0) scale(-1 1)';
// Metals: highlight, light, mid, dark, deep.
const METAL = {
  bronze:['#ffe2c4','#f2a46a','#c26a33','#7a3815','#3f1806'],
  silver:['#ffffff','#e4ebf5','#a9b7cc','#66758f','#2f3a4f'],
  gold:['#fff7d1','#ffd75e','#e8a51c','#9a6205','#4a2c00'],
  diamond:['#f0fdff','#9eeaff','#3fb3ea','#1c5fa8','#0b2a5c'],
  elite:['#f6e6ff','#c99bff','#8a4ff0','#4a1fa6','#1f0a52'],
  amet:['#ffe6f8','#ff9be0','#e04fb8','#8a1f86','#3d0c42']
};
// Each metal's stone: amber on bronze, sapphire on silver, ruby on gold, ice on diamond, magenta on Elite.
const GEM = {bronze:'amber', silver:'sapphire', gold:'pink', diamond:'ice', elite:'mag'};
const GEMC = {amber:['#fff6e0','#ffd08a','#ff9a2e','#7a3a05'], sapphire:['#ffffff','#bcd6ff','#3d7bff','#0f2a7a'], pink:['#ffffff','#ff8cc0','#ff2d87','#7a0b3c'], ice:['#ffffff','#d9fbff','#5fd3ff','#0b3f80'], mag:['#ffffff','#ffa8f0','#e83cd0','#4a0a5c']};
// The right-hand pieces and the keystone, drawn around a wing root at (110,90).
const PIECE = {
  core:'M100 50L121 76L115 106L100 146L85 106L79 76Z',
  wx:'M108 78C136 56 162 42 192 32C182 62 158 88 112 98Z',
  w0:'M110 76C128 62 148 46 168 18C164 48 146 72 114 88Z',
  w1:'M112 80C140 84 164 72 190 44C176 78 150 96 112 102Z',
  fork:'M146 80C156 70 164 58 168 38C172 58 166 74 154 86Z',
  w2:'M110 100C134 104 154 100 176 88C160 110 136 118 108 118Z',
  w3:'M106 114C124 122 140 128 158 124C142 136 120 140 104 130Z',
  crown:'M100 20L110 54L100 48L90 54Z',
  spike:'M106 58L124 30L116 62Z'
};
// One metal piece: its face, a bevel band inside its edge (lit along the top, dark along the bottom) and a bright rim.
const piece = (k,m,tf='') => `<g filter="url(#bds)"${tf?` transform="${tf}"`:''}><path d="${PIECE[k]}" fill="url(#bf-${m})"/><path d="${PIECE[k]}" fill="none" stroke="url(#bb-${m})" stroke-width="7" clip-path="url(#bk-${k})"/><path d="${PIECE[k]}" fill="none" stroke="url(#brim)" stroke-width="1.1"/></g>`;
// A cut gem: a rhombus in a radial glow with a lit facet and a shaded one.
const gem = (cx,cy,w,h,g) => { const T=[cx,cy-h/2], R=[cx+w/2,cy], B=[cx,cy+h/2], L=[cx-w/2,cy];
  return `<circle cx="${cx}" cy="${cy}" r="${w*1.5}" fill="url(#bgl-${g})"/><path d="${poly([T,R,B,L])}" fill="url(#bg-${g})"/>`
    +`<path d="${poly([T,[cx,cy],L])}" fill="#fff" opacity=".45"/><path d="${poly([[cx,cy],R,B])}" fill="#000" opacity=".22"/><path d="${poly([T,R,B,L])}" fill="none" stroke="${GEMC[g][1]}" stroke-width="1"/>`; };
// The crest for a Tier at Division step d (0 at V … 4 at I): the right-hand wing pieces (mirrored), crown, keystone and gem,
// plus `solid`, its outline as paths, for the shine, the Rank-up's crack clip and the small silhouette.
function crest(tier,d){
  const T=TIERS.indexOf(tier), m=tier, s=(.8+.05*d).toFixed(3), wingTf=`translate(110 90) scale(${s}) translate(-110 -90)`;
  const side=[]; if(T>=4) side.push(['wx','amet']); if(T>=3) side.push(['w0',m]); if(T>=2) side.push(['w3',m]); if(T>=1) side.push(['w2',m]);
  if(d>=2) side.push(['fork',m]); side.push(['w1',m]);
  const studs = d>=1 ? [[134,90],[156,80]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="url(#bg-${GEM[tier]})" stroke="${METAL[m][4]}" stroke-width="1"/><circle cx="${x-1.2}" cy="${y-1.4}" r="1.2" fill="#fff"/>`).join('') : '';
  const wing = side.map(([k,mm])=>piece(k,mm)).join('')+studs;
  const crown = T>=2||d>=3, spikes = T>=2&&d>=3, gw=13+2*T+1.5*d;
  const svg = `<g class="bw bw-l" style="transform-origin:90px 90px"><g transform="${FLIP} ${wingTf}">${wing}</g></g><g class="bw bw-r" style="transform-origin:110px 90px"><g transform="${wingTf}">${wing}</g></g>`
    + (spikes?piece('spike',m)+piece('spike',m,FLIP):'') + (crown?piece('crown',m):'') + piece('core',m)
    + (d>=4?`<g class="flare">${Array.from({length:8},(_,i)=>{ const a=i*45, L=i%2?16:28, [x1,y1]=[100+Math.cos(a*Math.PI/180)*L, 88+Math.sin(a*Math.PI/180)*L]; return `<path d="M100 88L${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="#fff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round"/>`; }).join('')}</g>`:'')
    + gem(100,88,gw,gw*1.6,GEM[tier]);
  const keys = side.map(([k])=>k);
  const solid = keys.map(k=>`<path d="${PIECE[k]}" transform="${wingTf}"/><path d="${PIECE[k]}" transform="${FLIP} ${wingTf}"/>`).join('')
    + (spikes?`<path d="${PIECE.spike}"/><path d="${PIECE.spike}" transform="${FLIP}"/>`:'') + (crown?`<path d="${PIECE.crown}"/>`:'') + `<path d="${PIECE.core}"/>`;
  return {svg,solid};
}
// The hard white shine that sweeps across a badge now and then: a wide slash and a thin one, clipped to the crest.
const shine = id => `<g clip-path="url(#${id})"><g class="shine"><path d="M0 0H22L-14 200H-36Z" fill="#fff" opacity=".35"/><path d="M30 0H36L0 200H-6Z" fill="#fff" opacity=".35"/></g></g>`;
const rays = (n,r0,R1,R2,w,fill) => Array.from({length:n},(_,i)=>{ const a=i*360/n, R=i%2?R2:R1; return `<path d="${poly([pt(r0,a-w),pt(R,a-w/5),pt(R,a+w/5),pt(r0,a+w)])}" fill="${fill}"/>`; }).join('');
const stops = s => s.map(([o,c,a])=>`<stop offset="${o}" stop-color="${c}"${a!=null?` stop-opacity="${a}"`:''}/>`).join('');
const lin = (id,s) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">${stops(s)}</linearGradient>`;
const rad = (id,s,a='') => `<radialGradient id="${id}" ${a}>${stops(s)}</radialGradient>`;
const halo = (id,c,o) => rad(id,[[0,c,o],[.55,c,o*.35],[1,c,0]],'gradientUnits="userSpaceOnUse" cx="100" cy="88" r="100"');
const BADGE_DEFS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  ${Object.entries(METAL).map(([k,c])=>lin('bf-'+k,[[0,c[1]],[.55,c[2]],[1,c[3]]])+lin('bb-'+k,[[0,c[0]],[.4,c[1]],[.6,c[3]],[1,c[4]]])).join('')}
  ${lin('brim',[[0,'#fff',.9],[.35,'#fff',.25],[.5,'#fff',0]])}
  ${Object.entries(GEMC).map(([k,c])=>rad('bg-'+k,[[0,c[0]],[.35,c[1]],[.75,c[2]],[1,c[3]]],'cx=".4" cy=".35" r=".75"')+rad('bgl-'+k,[[0,c[2],.75],[1,c[2],0]])).join('')}
  ${halo('bh-bronze','#ff9a52',.4)}${halo('bh-silver','#d6e4ff',.4)}${halo('bh-gold','#ffc83d',.5)}${halo('bh-diamond','#5fd3ff',.55)}${halo('bh-elite','#c44dff',.6)}
  ${rad('br-elite',[[0,'#ffd6ff',.9],[.6,'#b98bff',.35],[1,'#b98bff',0]],'gradientUnits="userSpaceOnUse" cx="100" cy="88" r="100"')}
  ${Object.entries(PIECE).map(([k,d])=>`<clipPath id="bk-${k}"><path d="${d}"/></clipPath>`).join('')}
  ${TIERS.map(k=>[0,1,2,3,4].map(d=>`<clipPath id="bc-${k}${d}">${crest(k,d).solid}</clipPath>`).join('')).join('')}
  <filter id="bds" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#0a0418" flood-opacity=".6"/></filter>
</defs></svg>`;
document.body.insertAdjacentHTML('beforeend', BADGE_DEFS);

// mode: 'sm' the flat silhouette; 'lg' the full badge, alive; 'still' the full badge without motion (the shelf, the Rank-up shards).
function badgeSVG(tier, div, mode){
  const isElite=tier==='elite', d=isElite?4:5-(ROMAN[div]||5), c=crest(tier,d);
  if(mode==='sm') return `<svg viewBox="4 12 192 132" style="--t:var(--${tier})" aria-hidden="true"><g style="fill:var(--t)">${c.solid}</g></svg>`;
  const pips = isElite ? `<path d="${poly([[82,150],[118,150],[124,160],[118,170],[82,170],[76,160]])}" fill="${METAL.elite[4]}" stroke="${METAL.elite[1]}" stroke-width="1.2" stroke-linejoin="round"/><text x="100" y="165.5" text-anchor="middle" style="font:800 15px var(--display);fill:#fff">#7</text>`
    : [0,1,2,3,4].map(i=>{ const x=76+i*12, on=i<=d; return `<path class="pip" ${on?'data-on="1"':''} d="${poly([[x,152.5],[x+4,158],[x,163.5],[x-4,158]])}" style="fill:${on?'var(--t)':'var(--line)'}"/>`; }).join('');
  const glow = d>=4 ? `<circle class="aura" cx="100" cy="88" r="100" fill="url(#bh-${tier})"/>` : '';
  const ray = isElite ? `<g class="bray"><g class="spin">${rays(24,40,100,82,1.4,'url(#br-elite)')}</g></g>` : '';
  return `<svg class="badge ${mode==='lg'?'b-anim':''}" viewBox="0 0 200 200" style="--t:var(--${tier})" role="img" aria-label="${t().tiers[tier]} ${isElite?'':div}">${glow}${ray}${c.svg}${shine(`bc-${tier}${d}`)}${pips}</svg>`;
}

const iconSVG = () => `<svg viewBox="0 0 96 96" role="img" aria-label="ULTI"><rect width="96" height="96" style="fill:var(--logo-bg,#0c0e0b)"/><circle cx="30" cy="24" r="8" style="fill:var(--accent)"/><circle cx="48" cy="24" r="8" style="fill:var(--accent)"/><circle cx="66" cy="24" r="6" style="fill:none;stroke:var(--accent);stroke-width:4"/><path d="M28 44V58A20 20 0 0 0 68 58V44" style="fill:none;stroke:#f4f1ff;stroke-width:12;stroke-linecap:round"/></svg>`;

const infoBtn = k => `<button class="info" data-a="info:${k}" aria-label="${t().infoT[k]}"><span>i</span></button>`;

function newSession(){
  return {ex:EXES.map(e=>({...e, sets:e.sets.map(([w,r])=>({w,r,done:false,rir:null,ov:null}))})), prs:[], pts:0};
}
// Warm-up: lighter than the Session's top weight on the Exercise AND before the first Set within 10% of that top weight.
function isWarm(e,s){
  if(s.ov!==null) return s.ov;
  const top=Math.max(...e.sets.map(x=>x.w)); if(!(top>0) || s.w>=top) return false;
  return e.sets.indexOf(s) < e.sets.findIndex(x=>x.w>=0.9*top);
}
const loadOf = (e,s) => e.bw ? BODYWEIGHT + s.w : s.w;
const e1rm = (w,r) => w*(1+r/30);
function wDisp(e,s){ return e.bw ? (s.w>0 ? `${t().bw} +${fmt(s.w)}` : t().bw) : fmt(s.w); }
function workingIdx(e,si){ let n=0; for(let i=0;i<=si;i++) if(!isWarm(e,e.sets[i])) n++; return n; }
function counts(){ let d=0,tot=0; st.ses.ex.forEach(e=>e.sets.forEach(s=>{ if(!isWarm(e,s)){tot++; if(s.done) d++;} })); return [d,tot]; }
function firstOpen(){ for(let ei=0;ei<st.ses.ex.length;ei++) for(let si=0;si<st.ses.ex[ei].sets.length;si++) if(!st.ses.ex[ei].sets[si].done) return {ei,si}; return null; }
function cur(){ if(!st.cur) st.cur = firstOpen(); return st.cur; }
function myScore(gi, period){
  const base = gi===0 ? st.weekPts : st.prPts;
  if(period==='week') return base;
  return gi===0 ? (period==='month' ? 640 + base : 7400 + base) : (period==='month' ? 120 + base : 1500 + base);
}
function boardRows(gi, period){
  return GROUPS[gi].rows[period].map(r=>{ const row=[...r]; if(row[0]==='me'){ row[1]=myScore(gi,period); if(period==='week'){ row[2]=st.weekDone; row[3]=st.target; } } return row; }).sort((a,b)=>b[1]-a[1]);
}

function recBadge(e){ const T=t(); if(e.calib) return `<span class="rec calib">${T.calib(e.calib)}</span>${infoBtn('calib')}`; return e.rec==='up' ? `<span class="rec up">${T.up(fmt(e.inc))}</span>` : e.rec==='stall' ? `<span class="rec stall">${T.stall}</span>` : ''; }
function rirBar(ei,si){
  if(!st.rirFor || st.rirFor.ei!==ei || st.rirFor.si!==si) return '';
  const T=t();
  return `<div class="rirbar"><span class="q">${T.rirQ} ${infoBtn('rir')}</span><span class="chips">${['0','1','2','3','4+'].map(v=>`<button data-a="rir:${v}">${v}</button>`).join('')}</span></div>`;

function toggleSet(ei,si){
  const e=st.ses.ex[ei], s=e.sets[si]; s.done=!s.done;
  if(!s.done){ st.rirFor=null; return; }
  if(!isWarm(e,s)){
    const v=e1rm(loadOf(e,s), s.r);
    if(e.calib){ st.rirFor={ei,si}; clearTimeout(rirTimer); rirTimer=setTimeout(()=>{ st.rirFor=null; render(); },4500); if(st.v>0){ st.cur=firstOpen(); render.follow=true; } return; }
    if(s.r>=1 && s.r<=12 && v>e.best+0.05){
      const g=(v/e.best-1)*100, pts=Math.max(1,Math.round(g*13)); e.best=v;
      const gs = g<1 ? fmt(g,1) : fmt(Math.round(g),0);
      st.ses.prs.push({name:e.name, gain:gs, pts}); st.ses.pts+=pts;
      showBanner(t().pr(nm(e.name), gs, pts));
    }
    st.rirFor={ei,si}; clearTimeout(rirTimer); rirTimer=setTimeout(()=>{ st.rirFor=null; render(); },4500);
  }
  if(st.v>0){ st.cur=firstOpen(); render.follow=true; }
}
function act(a){
  const [k,...p]=a.split(':');
  switch(k){
    case 'tab': st.tab=p[0]; break;
    case 'start': case 'resume':
      if(!st.ses){ st.ses=newSession(); st.cur=null; }
      st.inSession=true;
      try{ navigator.wakeLock && navigator.wakeLock.request('screen').then(l=>wakeLock=l).catch(()=>{}); }catch(_){}
      break;
    case 'minimize': st.inSession=false; break;
    case 'finish': finish(); return;
    case 'sum-ok':
      st.weekDone=Math.min(st.target,st.weekDone+1); st.weekPts+=30+st.ses.pts; st.prPts+=st.ses.pts;
      st.ses=null; st.inSession=false; st.tab='home'; st.rirFor=null; showOverlay('');
      try{ wakeLock && wakeLock.release(); }catch(_){}
      break;
    case 'set': toggleSet(+p[0],+p[1]); break;
    case 'warm': { const e=st.ses.ex[+p[0]], s=e.sets[+p[1]]; s.ov=!isWarm(e,s); break; }
    case 'edit': { const s=st.ses.ex[+p[0]].sets[+p[1]]; st.kp={ei:+p[0],si:+p[1],f:p[2],val:String(s[p[2]]),fresh:true}; break; }
    case 'kp': { const kp=st.kp; if(kp.fresh){kp.val='';kp.fresh=false;} if(kp.val.replace('.','').length<5) kp.val=(kp.val==='0'?'':kp.val)+p[0]; break; }
    case 'kp-dec': { const kp=st.kp; if(kp.fresh){kp.val='0';kp.fresh=false;} if(!kp.val.includes('.')) kp.val=(kp.val||'0')+'.'; break; }
    case 'kp-back': { const kp=st.kp; kp.fresh=false; kp.val=kp.val.slice(0,-1); break; }
    case 'kp-step': { const kp=st.kp, e=st.ses.ex[kp.ei]; const n=Math.max(0,(parseFloat(kp.val)||0)+(+p[0])*(kp.f==='w'?e.inc:1)); kp.val=String(Math.round(n*100)/100); kp.fresh=false; break; }
    case 'kp-done': { const kp=st.kp; if(kp){ const n=parseFloat(kp.val); if(!isNaN(n)) st.ses.ex[kp.ei].sets[kp.si][kp.f]= kp.f==='r'?Math.round(n):n; } st.kp=null; break; }
    case 'step': { const c=cur(); if(!c) break; const e=st.ses.ex[c.ei], s=e.sets[c.si]; s[p[0]]=Math.max(0, Math.round((s[p[0]]+(+p[1])*(p[0]==='w'?e.inc:1))*100)/100); break; }
    case 'rir': { const r=st.rirFor; if(r) st.ses.ex[r.ei].sets[r.si].rir=p[0]; st.rirFor=null; clearTimeout(rirTimer); break; }
    case 'sel': st.cur={ei:+p[0],si:+p[1]}; break;
    case 'nav': { const all=[]; st.ses.ex.forEach((e,ei)=>e.sets.forEach((s,si)=>all.push({ei,si}))); const c=cur()||all[all.length-1]; let i=all.findIndex(x=>x.ei===c.ei&&x.si===c.si)+(+p[0]); i=Math.max(0,Math.min(all.length-1,i)); st.cur=all[i]; break; }
    case 'auth': st.auth=p[0]; break;
    case 'reg-submit': { const el=document.getElementById('email'); st.email=(el&&el.value)||''; st.auth='verify'; break; }
    case 'ob-units': st.units=p[0]; break;
    case 'ob-sex': st.sex=p[0]; break;
    case 'ob-target': st.target=+p[0]; break;
    case 'enter-app': st.auth=null; st.tab='home'; break;
    case 'logout': st.auth='welcome'; st.ses=null; st.inSession=false; st.sheet=null; break;
    case 'layout': st.v=+p[0]; st.cur=null; break;
    case 'since-x': st.since=false; break;
    case 'race': st.group=+p[0]; st.period='week'; st.tab='groups'; break;
    case 'group': st.group=+p[0]; break;
    case 'period': st.period=p[0]; break;
    case 'member': st.sheet={type:'member',id:p[0]}; break;
    case 'invite': st.sheet={type:'invite'}; break;
    case 'info': st.sheet={type:'info',k:p[0]}; break;
    case 'sheet-x': st.sheet=null; break;
    case 'vis': st.vis[p[0]]=!st.vis[p[0]]; break;
    case 'rankup': rankUp(p[0]); return;
    case 'noop': return;
    case 'rank-x': ruClose(); return;
    case 'ru-tap': ruTap(); return;
    case 'sfx': st.sfx=p[0]; sfxPreview(p[0]); break;
    case 'pv': st.v=(st.v+(+p[0])+VARIANTS.length)%VARIANTS.length; st.cur=null; try{ history.replaceState(null,'','#'+VARIANTS[st.v].id); }catch(_){} break;
    case 'theme': st.theme={auto:'dark',dark:'light',light:'auto'}[st.theme]; if(st.theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',st.theme); break;
    case 'lang': st.lang=st.lang==='es'?'en':'es'; if(document.querySelector('.overlay')) showOverlay(''); break;
  }
  render();
}

/* ---------- sound: Web Audio synthesis, started by the user's own tap. Metal, heavier with each Tier.
   Phone speakers drop almost everything under ~150 Hz, so the weight has to live in driven low-mids: distortion turns a 41 Hz 808
   into harmonics a phone can play. Nothing rings high and tonal, because that is what reads as a chime. ---------- */
let AC=null, MASTER=null, NOISE=null, REV=null;
const CURVES={};
function audioInit(){
  try{
    // Left as "ambient" on iPhones: the silent switch mutes it, but "playback" would pause the user's music.
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state!=='running' && AC.resume) AC.resume();
    if(!MASTER){
      const comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=6; comp.ratio.value=8; comp.attack.value=.002; comp.release.value=.2;
      const clip=shaper(1.3); MASTER=AC.createGain(); MASTER.gain.value=.8; MASTER.connect(comp); comp.connect(clip); clip.connect(AC.destination);
      const sr=AC.sampleRate, len=sr*2.4, ir=AC.createBuffer(2,len,sr);
      for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.5); }
      const conv=AC.createConvolver(); conv.buffer=ir; REV=AC.createGain(); REV.gain.value=.8; REV.connect(conv); conv.connect(MASTER);
      NOISE=AC.createBuffer(1,sr*2,sr); const n=NOISE.getChannelData(0); for(let i=0;i<n.length;i++) n[i]=Math.random()*2-1;
    }
  }catch(_){ AC=null; }
}
const now = () => AC ? AC.currentTime : 0;
function env(g,t0,a,peak,hold,rel){ g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(peak,t0+a); g.gain.setValueAtTime(peak,t0+a+hold); g.gain.exponentialRampToValueAtTime(.0001,t0+a+hold+rel); }
function mkF([type,f,Q,f2,t2,f3,t3],t0){ const b=AC.createBiquadFilter(); b.type=type; b.frequency.setValueAtTime(f,t0); if(Q) b.Q.value=Q;
  if(f2) b.frequency.exponentialRampToValueAtTime(f2,t0+t2); if(f3) b.frequency.exponentialRampToValueAtTime(f3,t0+t3); return b; }
function send(g,rev){ g.connect(MASTER); if(rev){ const s=AC.createGain(); s.gain.value=rev; g.connect(s); s.connect(REV); } }
// Soft-clipping drive (tanh), normalised so full scale stays full scale.
function shaper(k){ const w=AC.createWaveShaper(); if(!CURVES[k]){ const c=new Float32Array(2048); for(let i=0;i<2048;i++){ const x=i/1023.5-1; c[i]=Math.tanh(k*x)/Math.tanh(k); } CURVES[k]=c; } w.curve=CURVES[k]; w.oversample='2x'; return w; }
// V = one voice: oscillators (f may be a list, each spread by det cents) → optional drive → filters → envelope. f2 is a pitch ratio reached after ft s.
// N = the same for noise. Both: start t, duration dur, peak gain, attack a, hold, optional swell (rises to the end), reverb send rev.
function V(o){
  if(!AC) return; const mix=AC.createGain(); mix.gain.value=o.pre||1;
  [].concat(o.f).forEach(f=>(o.det||[0]).forEach(det=>{ const n=AC.createOscillator(); n.type=o.type||'sine'; n.detune.value=det;
    n.frequency.setValueAtTime(f,o.t); if(o.f2) n.frequency.exponentialRampToValueAtTime(f*o.f2,o.t+(o.ft||o.dur));
    n.connect(mix); n.start(o.t); n.stop(o.t+o.dur+.1); }));
  voiceOut(mix,o);
}
function N(o){
  if(!AC) return; const s=AC.createBufferSource(); s.buffer=NOISE; s.loop=true; s.start(o.t,Math.random()*1.5); s.stop(o.t+o.dur+.1); voiceOut(s,o);
}
function voiceOut(src,o){
  const t0=o.t, a=o.a||.004, hold=o.hold||0; let node=src;
  if(o.drive){ const w=shaper(o.drive); node.connect(w); node=w; }
  (o.filters||[]).forEach(fd=>{ const b=mkF(fd,t0); node.connect(b); node=b; });
  const g=AC.createGain();
  if(o.swell){ g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(o.peak,t0+o.dur); g.gain.linearRampToValueAtTime(0,t0+o.dur+.03); }

const semi = (f,s) => f*Math.pow(2,s/12);
const E1=41.2, E2=82.41;

// The kit.
const crunch=(t,n,span,p=1)=>{ for(let i=0;i<n;i++) N({t:t+Math.random()*span,dur:.006+Math.random()*.02,peak:.35*p*(.5+Math.random()*.5),a:.001,drive:4,filters:[['bandpass',500+Math.random()*1800,3]]}); };
const kick=(t,p=1,f=150)=>{ V({f,f2:.3,ft:.06,t,dur:.4,peak:.5*p,a:.002,drive:4,filters:[['lowpass',3000]]}); N({t,dur:.015,peak:.3*p,a:.001,filters:[['bandpass',3000,1]]}); };
const snare=(t,p=1)=>{ N({t,dur:.25,peak:.4*p,a:.001,drive:2,filters:[['bandpass',1700,.7]],rev:.35}); V({f:190,f2:.75,ft:.06,t,dur:.14,peak:.3*p,a:.001,drive:3}); };
const crash=(t,p=1)=>N({t,dur:1.3,peak:.13*p,a:.002,filters:[['highpass',3500,.5]],rev:.25});
// A power chord (root, fifth, octave) through amp-style distortion and a speaker-cabinet low-pass. mute = palm-muted chug.
const gtr=(t,root,dur,p=1,mute)=>V({type:'sawtooth',f:[root,root*1.4983,root*2],det:[-8,8],t,dur,peak:.2*p,a:.003,hold:mute?0:dur*.4,pre:.5,drive:20,filters:[['highpass',90,.7],['lowpass',mute?650:3600,mute?1.2:.8]]});
// Elite only: a reversed swell while the cracked badge draws in, just before the drop.
const sfxSuck=(t,dur)=>N({t,dur:dur*.9,peak:.3,swell:true,filters:[['highpass',600,.7,3000,dur*.9]],rev:.2});

// crack(n,K,t) on each of K cracks, impact + payoff on the shatter, stamp when the Division lands, pip per lit pip. cfg.lvl: Division 0, Silver 1 … Elite 4.
const SFX = {
  // Metal: a kick and a palm-muted chug per crack, an open power chord on the shatter, then a riff that grows with the Tier.
  metal:{
    crack(n,K,t){ const p=n/K; crunch(t,5+n*3,.07,.6+.5*p); kick(t,.65+.55*p); gtr(t,E2,.1+.12*p,.65+.45*p,true); },
    impact(cfg,t){ const L=cfg.lvl; kick(t,1.3); snare(t,1); crash(t,.8+L*.1); gtr(t,E2,L===1?1.5:2.2,1.2);
      if(L>=4) V({type:'sawtooth',f:E1,det:[-8,8],t,dur:2.4,peak:.12,a:.003,hold:.8,pre:.5,drive:12,filters:[['lowpass',900,.9]]}); },
    payoff(cfg,t){
      const L=cfg.lvl, s=.09; if(L<2) return; let tt=t+.85;
      const chug=n=>{ for(let i=0;i<n;i++){ gtr(tt,E2,.075,.85,true); kick(tt,.7); tt+=s; } };
      const hit=(f,dur)=>{ gtr(tt,f,dur,1.05); snare(tt,.9); kick(tt,1); tt+=dur; };
      if(L===2){ chug(2); hit(semi(E2,3),.36); hit(E2,1.3); return; }
      chug(3); hit(semi(E2,3),.27); chug(3); hit(semi(E2,L>=4?6:5),.27);
      if(L>=4){ chug(3); hit(semi(E2,5),.27); }
      const fin=tt; hit(E2,1.6); crash(fin,1);
      if(L>=4){ V({type:'sawtooth',f:E1,det:[-8,8],t:fin,dur:1.8,peak:.12,a:.003,hold:.6,pre:.5,drive:12,filters:[['lowpass',900,.9]]}); for(let i=1;i<12;i++) kick(fin+i*.06,.5); }
    },
    stamp(t){ kick(t,1.1); snare(t,1); },
    pip(i,t){ kick(t,.6+i*.1); }
  }
};
function sfxPreview(kind){
  audioInit(); setTimeout(sfxStatus,700); if(!AC) return; const S=SFX[kind], cfg=RU_CFG.gold; let t=now()+.05;

// Every line is filled from real stats; the most impressive true one becomes the headline, never one of the last three.
function ruMessages(from,to){
  const T=t(), S=RU_STATS, M=T.ruMsg, cands=[];
  const add=(id,score,text,chip)=>cands.push({id,score,text,chip});
  if(to==='elite') add('elite',.97,M.elite(S.eliteCount));
  if(S.group.pos===1) add('top',.95,M.top(nm(S.group.name)),{n:1,f:n=>M.chipTop(n,nm(S.group.name))});
  if(S.streak>=8) add('streak',.9,M.streak(S.streak),{n:S.streak,f:M.chipStreak});
  if(S.best.p>=10) add('best',.8,M.best(nm(S.best.ex),S.best.p),{n:S.best.p,f:n=>M.chipBest(n,nm(S.best.ex))});
  if(S.passed.length) add('passed',.7,M.passed(S.passed[0],S.passed.length-1));
  if(S.prs>=3) add('prs',.6,M.prs(S.prs,S.weeks),{n:S.prs,f:M.chipPrs});
  if(S.startTier!==to && to!=='div') add('climb',.55,M.climb(T.tiers[S.startTier],T.tiers[to]));
  const toT=to==='div'?'silver':to; if(from!==toT) add('speed',.5,M.speed(T.tiers[from],T.tiers[toT],S.weeks),{n:S.weeks,f:M.chipWeeks});
  add('showup',.45,M.showup(S.sessions),{n:S.sessions,f:M.chipSessions});
  add('sessions',.4,M.sessions(S.sessions),{n:S.sessions,f:M.chipSessions});

  if(Math.abs(S.cons-S.prog)/Math.max(S.cons,S.prog)<=.1) add('balanced',.3,M.balanced(S.cons,S.prog));
  cands.sort((a,b)=>b.score-a.score);
  const recent=lsGet('ulti-ru-recent',[]);
  const head=cands.find(c=>!recent.includes(c.id)) || cands[cands.length-1];
  lsSet('ulti-ru-recent',[head.id,...recent].slice(0,3));
  const chips=[], seen=new Set();
  for(const c of cands){ if(c===head || !c.chip || seen.has(c.chip.f)) continue; seen.add(c.chip.f); chips.push(c.chip); if(chips.length===3) break; }
  const pool=to==='div'?T.ruKick:[...T.ruKick,T.ruKickTier], lastK=lsGet('ulti-ru-kick',-1); let k=Math.floor(Math.random()*pool.length); if(k===lastK) k=(k+1)%pool.length; lsSet('ulti-ru-kick',k);

}

// Cracks walk out from an impact point as jagged lines that taper and throw off side branches. Every piece of crack belongs
// to the hit that opens it (hits 1..K), so each hit visibly extends them. The main cracks continue, unseen, past the edge
// to cut the shards: the pieces that fly off are the pieces the cracks drew.
function crackGeo(K){
  const cx=100+(Math.random()*16-8), cy=100+(Math.random()*16-8), n=8, base=Math.random()*45, mains=[], bits=[];
  const walk=(x,y,ang,len,w0,t0,t1)=>{ const P=[[x,y]]; let a=ang, d=0;
    while(d<len){ a=ang+(a-ang)*.55+(Math.random()-.5)*.9; const st=4+Math.random()*7; x+=Math.cos(a)*st; y+=Math.sin(a)*st; d+=st; P.push([x,y]); }
    for(let i=1;i<P.length;i++){ const f=i/(P.length-1); bits.push({a:P[i-1], b:P[i], w:Math.max(.35,w0*(1-f*.9)), h:Math.max(1,Math.min(K,Math.ceil((t0+(t1-t0)*f)*K)))}); }
    return P; };
  for(let i=0;i<n;i++){
    const ang=(base+i*360/n+(Math.random()*16-8))*Math.PI/180, t0=(i%3)*.24+Math.random()*.05, P=walk(cx,cy,ang,105+Math.random()*25,2.8,t0,1);
    [.3,.55].forEach(q=>{ if(Math.random()<.75){ const j=Math.floor((P.length-1)*q), side=Math.random()<.5?-1:1; walk(P[j][0],P[j][1],ang+side*(.45+Math.random()*.5),18+Math.random()*26,1.4,t0+(1-t0)*q,1); } });
    mains.push({P, far:[cx+Math.cos(ang)*260, cy+Math.sin(ang)*260]}); }
  return {cx,cy,mains,bits};
}
// One group per hit: a light leak, then each crack as a dark split with a faint lit lower edge, grouped by width.
function crackPaths(geo,K){
  let s=''; const seg=q=>`M${P2(q.a)}L${P2(q.b)}`;
  for(let h=1;h<=K;h++){ const B=geo.bits.filter(q=>q.h===h), byW={}; if(!B.length) continue;
    B.forEach(q=>{ const w=(Math.round(q.w*2)/2).toFixed(1); (byW[w]=byW[w]||[]).push(seg(q)); });
    s+=`<g data-h="${h}"><path class="lk" d="${B.map(seg).join('')}"/>`
      + Object.entries(byW).map(([w,d])=>`<path class="lit" d="${d.join('')}" stroke-width="${w}" transform="translate(.6 .9)"/><path class="dk" d="${d.join('')}" stroke-width="${w}"/>`).join('') + `</g>`; }
  return s;
}

function rankUp(to){
  const T=t(), cfg=RU_CFG[to], [fT,fD]=RU_FROM[to], [nT,nD]=RU_TO[to];
  const msg=ruMessages(fT,to), geo=crackGeo(cfg.hits||1);
  const crackSvg = `<svg class="ru-cracks" viewBox="0 0 200 200" aria-hidden="true"><defs><clipPath id="ruclip">${crest(fT,5-ROMAN[fD]).solid}</clipPath></defs><g clip-path="url(#ruclip)">${crackPaths(geo,cfg.hits||1)}</g></svg>`;
  const oldBadge = badgeSVG(fT,fD,'lg'), oldStill = badgeSVG(fT,fD,'still');
  const shards = geo.mains.map((c,i)=>{ const nx=geo.mains[(i+1)%geo.mains.length], wedge=c.P.concat([c.far,nx.far],nx.P.slice().reverse());
      const clip=wedge.map(p=>`${(p[0]/2).toFixed(1)}% ${(p[1]/2).toFixed(1)}%`).join(',');
      const mid=Math.atan2((c.far[1]+nx.far[1])/2-geo.cy,(c.far[0]+nx.far[0])/2-geo.cx), dist=170+Math.random()*120;
      return `<div style="clip-path:polygon(${clip});--dx:${Math.round(Math.cos(mid)*dist)}px;--dy:${Math.round(Math.sin(mid)*dist)}px;--r:${Math.round(Math.random()*320-160)}deg">${oldStill}</div>`; }).join('');
  const word=T.tiers[nT], letters=[...word].map((c,i)=>`<span class="l" style="--i:${i}">${c}</span>`).join('');
  const chips=msg.chips.map((c,i)=>`<span style="--i:${i}">${c.f(0)}</span>`).join('');
  const el=document.getElementById('overlay');
  el.innerHTML=`<div class="ru ${cfg.elite?'elite':''} ${cfg.div?'divmode':''}" data-a="ru-tap" style="--t:var(--${nT});--t0:var(--${fT})">
    <div class="ru-dark"></div><div class="ru-flood"></div><div class="ru-rays"></div><div class="ru-beam"></div><div class="ru-vig"></div>
    <div class="ru-in">
      <div class="eyebrow ru-kicker">${T.ruNews}</div>
      <div class="ru-stage"><div class="ru-glow"></div>
        <div class="ru-old"><div class="ru-whole">${oldBadge}${crackSvg}</div><div class="ru-shards">${shards}</div></div>
        <div class="ru-new">${badgeSVG(nT,nD,'lg')}</div></div>
      <p class="ru-tap">${T.ruTapHint}</p>
      <h1 class="disp ru-name"><span class="w">${letters}</span>${nD?`<span class="ru-div">${nD}</span>`:''}</h1>
      <div class="ru-chips">${chips}</div>
      <p class="ru-msg"></p>
      <button class="btn-primary ru-cont" data-a="rank-x">${T.cont}</button>
    </div><div class="ru-flash"></div><canvas class="ru-cv"></canvas></div>`;
  const root=el.querySelector('.ru'), cv=root.querySelector('.ru-cv'), dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  const newPips=[...root.querySelectorAll('.ru-new svg .pip')], lit=newPips.filter(c=>c.dataset.on);
  newPips.forEach(c=>c.style.fill='var(--line)');
  RU={to,cfg,el:root,ctx:cv.getContext('2d'),dpr,stage:0,started:false,fired:false,timers:[],st:[],parts:[],frames:0,ft:0,scale:1,last:0,
      colors:{t:cssVar('--'+nT),a:cssVar('--accent'),w:'#ffffff'},pips:lit,msg,sfx:SFX[st.sfx]};
  RU.ctx.setTransform(dpr,0,0,dpr,0,0);
  requestAnimationFrame(ruLoop);
  if(cfg.div){ audioInit(); RU.started=true; root.classList.add('started'); ruAt(1000,ruImpact); }
}
function ruAt(ms,f){ RU.timers.push(setTimeout(()=>{ if(RU) f(); },ms)); }
// Taps: the first one lands the first crack, each next one lands the next crack, and once the reveal has played for a second they skip to the end.
function ruTap(){
  if(!RU) return;
  if(!RU.started){ RU.started=true; audioInit(); RU.el.classList.add('started'); if(reducedMotion()){ ruFire(); return; } ruStage(1); return; }
  if(!RU.fired){ if(performance.now()-RU.stageAt>150) ruStage(RU.stage+1); return; }
  ruSkip();
}
// Each crack is one hit: the cracks jump outward, the badge jolts, light starts to leak and exactly one sound plays.
// Hits come faster and harder; the beat after the last one shatters the badge.
function ruStage(n){
  if(!RU || RU.fired) return; RU.st.forEach(clearTimeout); RU.st=[]; RU.stage=n; RU.stageAt=performance.now();
  const el=RU.el, cfg=RU.cfg, K=cfg.hits, p=n/K;
  if(n>K){ ruFire(); return; }
  el.querySelectorAll('.ru-cracks [data-h]').forEach(g=>g.classList.toggle('on',+g.dataset.h<=n));
  el.style.setProperty('--leak',(p*p*.8).toFixed(2)); el.style.setProperty('--glow',.15+.75*p); el.style.setProperty('--p',.6*p); if(cfg.elite) el.style.setProperty('--dark',.92*p);
  el.classList.remove('jolt'); void el.offsetWidth; el.classList.add('jolt');
  RU.sfx.crack(n,K,now()); ruLeak(4+n*4);
  RU.st.push(setTimeout(()=>ruStage(n+1),cfg.gap*(1-.4*p)));
}
function ruLoop(ts){
  if(!RU) return;
  const dt=RU.last?Math.min(50,ts-RU.last):16; RU.last=ts;
  if(RU.frames<20){ RU.frames++; RU.ft+=dt; if(RU.frames===20 && RU.ft/20>24) RU.scale=.5; }
  if(RU.cfg.elite && RU.started && !RU.fired && Math.random()<.5) RU.parts.push({k:'star',x:Math.random()*innerWidth,y:Math.random()*innerHeight,life:0,max:2400,s:.6+Math.random()*1.4,c:'#fff'});
  if(RU.started && !RU.fired && RU.stage>=RU.cfg.hits-1 && Math.random()<.4) ruLeak(1);
  if(RU.idle && Math.random()<.25*RU.scale) ruEmber();
  ruParticles(dt);
  requestAnimationFrame(ruLoop);
}
function ruCenter(){ const r=RU.el.querySelector('.ru-stage').getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
function ruLeak(n){ const [cx,cy]=ruCenter(); for(let i=0;i<n*RU.scale;i++){ const a=Math.random()*Math.PI*2, v=.05+Math.random()*.15; RU.parts.push({k:'burst',x:cx+Math.cos(a)*20,y:cy+Math.sin(a)*20,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:500+Math.random()*400,s:1+Math.random()*1.5,c:Math.random()<.7?RU.colors.t:RU.colors.w}); } }
function ruBurst(n){ const [cx,cy]=ruCenter(), cs=[RU.colors.t,RU.colors.w,RU.colors.a];
  for(let i=0;i<n*RU.scale;i++){ const a=Math.random()*Math.PI*2, v=.25+Math.random()*.75; RU.parts.push({k:'burst',x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:600+Math.random()*700,s:1.5+Math.random()*2,c:cs[i%3]}); } }
function ruRing(w=6){ const [cx,cy]=ruCenter(); RU.parts.push({k:'ring',x:cx,y:cy,life:0,max:750,w,c:RU.colors.t}); }
function ruConfetti(n){ const [cx]=ruCenter(), cs=[RU.colors.t,RU.colors.w,RU.colors.a];
  for(let i=0;i<n*RU.scale;i++) RU.parts.push({k:'conf',x:cx+(Math.random()-.5)*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*.12,vy:.12+Math.random()*.2,r:Math.random()*6,vr:(Math.random()-.5)*.02,life:0,max:4200,s:5+Math.random()*4,c:cs[i%3]}); }
function ruEmber(){ RU.parts.push({k:'ember',x:Math.random()*innerWidth,y:innerHeight+10,vx:(Math.random()-.5)*.02,vy:-.03-Math.random()*.06,life:0,max:4000+Math.random()*2000,s:1+Math.random()*2,c:Math.random()<.5?RU.colors.t:RU.colors.a}); }
function ruParticles(dt){
  const c=RU.ctx; c.clearRect(0,0,innerWidth,innerHeight); const keep=[];
  for(const q of RU.parts){
    q.life+=dt; if(q.life>q.max) continue; keep.push(q); const f=q.life/q.max;
    c.globalCompositeOperation=q.k==='conf'?'source-over':'lighter';
    if(q.k==='burst'){ q.vx*=.985; q.vy=q.vy*.985+.0006*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; c.globalAlpha=1-f; c.fillStyle=q.c; c.beginPath(); c.arc(q.x,q.y,q.s,0,7); c.fill(); }
    else if(q.k==='ring'){ c.globalAlpha=1-f; c.strokeStyle=q.c; c.lineWidth=q.w*(1-f)+1; c.beginPath(); c.arc(q.x,q.y,40+f*420,0,7); c.stroke(); }
    else if(q.k==='conf'){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.r+=q.vr*dt; c.globalAlpha=f>.8?(1-f)*5:1; c.fillStyle=q.c; c.save(); c.translate(q.x,q.y); c.rotate(q.r); c.fillRect(-q.s/2,-q.s*.8,q.s,q.s*1.6); c.restore(); }
    else if(q.k==='ember'){ q.x+=q.vx*dt; q.y+=q.vy*dt; c.globalAlpha=Math.sin(f*Math.PI)*.8; c.fillStyle=q.c; c.beginPath(); c.arc(q.x,q.y,q.s,0,7); c.fill(); }
    else if(q.k==='star'){ c.globalAlpha=Math.sin(f*Math.PI)*(RU.fired?.4:.9); c.fillStyle=q.c; c.beginPath(); c.arc(q.x,q.y,q.s,0,7); c.fill(); }
  }

}
function ruFire(){
  if(!RU || RU.fired) return; RU.fired=true; RU.st.forEach(clearTimeout); RU.st=[];
  const el=RU.el; el.querySelector('.ru-kicker').style.opacity=0; el.classList.remove('jolt');
  if(reducedMotion()){ ruImpact(); return; }
  if(RU.cfg.elite){ el.classList.add('charge'); sfxSuck(now(),.46); ruAt(460,ruImpact); }
  else ruAt(90,ruImpact);
}
function ruImpact(){
  const el=RU.el, cfg=RU.cfg, rm=reducedMotion(), S=RU.sfx, tm=cfg.div?.45:cfg.small?.72:cfg.elite?1.15:1;
  RU.fired=true; RU.firedAt=performance.now(); el.classList.add('fired'); el.style.setProperty('--glow',cfg.div?.4:1);
  if(!rm && !cfg.div) el.classList.add('flash');
  if(cfg.div) S.stamp(now()); else { S.impact(cfg,now()); S.payoff(cfg,now()); try{ navigator.vibrate && navigator.vibrate([30,40,80]); }catch(_){} }
  if(!rm){ ruRing(cfg.div?3:6); ruBurst(cfg.parts); }
  if(cfg.beam) el.classList.add('beam');
  ruAt(50,()=>{ if(!cfg.div) el.classList.add('flood'); if(cfg.zoom) el.classList.add('zoom'); if(!cfg.small) el.classList.add('shake'); if(cfg.rays) el.classList.add('rays'); if(!rm && !cfg.div) ruConfetti(cfg.elite?110:cfg.small?40:80); el.style.setProperty('--glow',.55); });
  if(cfg.second && !rm) ruAt(250,()=>{ ruRing(4); ruBurst(cfg.parts/3); });
  if(cfg.elite && !rm) [900,1700].forEach(ms=>ruAt(ms,()=>{ ruRing(3); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }));
  const slamAt=850*tm, letters=el.querySelectorAll('.ru-name .l').length;
  ruAt(slamAt,()=>el.classList.add('slam'));
  const stampAt=slamAt+letters*35+150;
  ruAt(stampAt,()=>{ el.classList.add('numstamp'); if(!cfg.div) S.stamp(now());
    RU.pips.forEach((c,i)=>setTimeout(()=>{ if(!RU) return; c.style.fill='var(--t)'; S.pip(i,now()); },180+i*120)); });
  ruAt(Math.max(stampAt+300,2050*tm),()=>{ el.classList.add('stats'); el.querySelectorAll('.ru-chips span').forEach((s,i)=>ruCount(s,RU.msg.chips[i])); });
  ruAt(Math.max(stampAt+700,3250*tm),ruRest);
}
function ruCount(span,chip){ const t0=performance.now(), d=700; (function step(ts){ if(!RU) return; const f=Math.min(1,(ts-t0)/d), n=Math.round(chip.n*(1-Math.pow(1-f,3))); span.textContent=chip.f(n); if(f<1) requestAnimationFrame(step); })(t0); }
function ruRest(){
  if(!RU) return; const el=RU.el;
  el.querySelector('.ru-kicker').textContent=RU.msg.kicker; el.querySelector('.ru-kicker').style.opacity=1;
  el.querySelector('.ru-msg').textContent=RU.msg.head; el.classList.add('msg'); RU.idle=true; el.classList.add('idle');
}
function ruSkip(){
  if(!RU || !RU.fired || performance.now()-RU.firedAt<1000 || RU.el.classList.contains('skip')) return;
  RU.timers.forEach(clearTimeout); RU.timers=[];
  const el=RU.el; el.classList.add('skip','fired','slam','numstamp','stats'); if(!RU.cfg.div) el.classList.add('flood');
  if(RU.cfg.beam) el.classList.add('beam'); if(RU.cfg.rays) el.classList.add('rays');
  RU.pips.forEach(c=>c.style.fill='var(--t)');
  el.querySelectorAll('.ru-chips span').forEach((s,i)=>s.textContent=RU.msg.chips[i].f(RU.msg.chips[i].n));
  RU.parts=RU.parts.filter(q=>q.k==='ember'); ruRest();
}
function ruClose(){ if(RU){ RU.timers.forEach(clearTimeout); RU.st.forEach(clearTimeout); } RU=null; showOverlay(''); }

document.addEventListener('click', ev=>{ const b=ev.target.closest('[data-a]'); if(b) act(b.dataset.a); });
document.addEventListener('input', ev=>{
  if(ev.target.id==='code' && st.auth==='verify' && ev.target.value.replace(/\D/g,'').length>=6) act('auth:ob1');
});
document.addEventListener('keydown', ev=>{
  if(ev.target.closest('input,textarea,[contenteditable]')) return;
  if(ev.key==='ArrowLeft') act('pv:-1'); else if(ev.key==='ArrowRight') act('pv:1');
});
render();
</script>

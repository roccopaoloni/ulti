name: CI

on:
  # Branches get CI from their pull request, so a branch push doesn't run it twice.
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Detect server changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'supabase/**'
              - 'packages/rules/**'
              - 'integration/**'
              - '.github/workflows/**'
              - 'package-lock.json'

  rules:
    name: Rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Integration tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start the local Supabase stack
        run: npx supabase start -x studio,imgproxy,vector,logflare,realtime,storage-api,postgres-meta,supavisor
        env:
          # Scheduled jobs reach the functions through the API gateway on the stack's Docker network.
          ULTI_FUNCTIONS_URL: http://kong:8000/functions/v1
          # Shared by Vault and the recompute function; any value will do for a throwaway stack.
          ULTI_RECOMPUTE_SECRET: local-stack-recompute-secret
      - run: npm run test:integration -- --shard=${{ matrix.shard }}/3
      - name: Bundle Edge Functions the way deploy does
        # Once is enough, so only the first shard does it.
        if: matrix.shard == 1
        # `supabase functions deploy` bundles each function with the edge runtime's `bundle`
        # command (it has no dry-run), so run that command with the image `supabase start` pulled.
        # It runs from each function's directory so it finds that function's deno.json, not the
        # npm workspace at the repository root. Folders starting with _ hold shared code, not functions.
        run: |
          shopt -s nullglob
          image=$(docker inspect --format '{{.Config.Image}}' supabase_edge_runtime_ulti)
          for dir in supabase/functions/[!_]*/; do
            name=$(basename "$dir")
            echo "Bundling $name"
            docker run --rm -v "$PWD:$PWD:ro" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$PWD/$dir" "$image" bundle \
              --entrypoint "$PWD/${dir}index.ts" \
              --output "$RUNNER_TEMP/$name.eszip"
            test -s "$RUNNER_TEMP/$name.eszip"
            ls -l "$RUNNER_TEMP/$name.eszip"
          done

  deploy:
    name: Deploy the backend
    # Only a push to main deploys, and only after every test has passed. Vercel deploys the app itself.
    # Skipped, with the integration shards, when nothing server-side changed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'
    needs: [changes, rules, integration]
    runs-on: ubuntu-latest
    concurrency: deploy-hosted-supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Derive the recompute secret
        # The retry job and the recompute function share a secret. Deriving it from the database
        # password gives the same value on every deploy (nothing to rotate or store by hand), and
        # changes it, in both places, only when the password changes.
        run: |
          secret=$(printf 'ulti-recompute' | openssl dgst -sha256 -hmac "$SUPABASE_DB_PASSWORD" -r | cut -d' ' -f1)
          echo "::add-mask::$secret"
          echo "ULTI_RECOMPUTE_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Set the recompute secret on the Edge Functions
        # Before the migrations, so the function knows the secret by the time Vault hands it out.
        run: npx supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" RECOMPUTE_SECRET="$ULTI_RECOMPUTE_SECRET"
      - name: Apply migrations
        # Parallel branches merge migrations dated before ones already applied, so apply those too.
        run: npx supabase db push --yes --include-all
        env:
          # Written to Vault with the migrations, for the database's scheduled jobs (config.toml),
          # along with ULTI_RECOMPUTE_SECRET from the step above.
          ULTI_FUNCTIONS_URL: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1
      - name: Deploy Edge Functions
        run: npx supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
      - name: Check the hosted health endpoint
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/health"
